events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Upstream Services
    upstream pragyam_api {
        server api:4000;
    }

    upstream pragyam_web {
        server web:3000;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name pragyam.com www.pragyam.com api.pragyam.com;
        return 301 https://$host$request_uri;
    }

    # API Server (api.pragyam.com)
    server {
        listen 443 ssl http2;
        server_name api.pragyam.com;

        ssl_certificate /etc/letsencrypt/live/pragyam.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pragyam.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://pragyam_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Web & Admin Portal (pragyam.com)
    server {
        listen 443 ssl http2;
        server_name pragyam.com www.pragyam.com;

        ssl_certificate /etc/letsencrypt/live/pragyam.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pragyam.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://pragyam_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            proxy_pass http://pragyam_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
