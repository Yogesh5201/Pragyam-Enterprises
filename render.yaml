services:
  # 1. Backend REST API
  - type: web
    name: pragyam-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --install-links && npm run build --workspace=@pragyam/types && npm run build --workspace=@pragyam/shared && npm run build --workspace=@pragyam/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@pragyam.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        value: Pragyam@Admin2026!
      - key: DATABASE_URL
        fromDatabase:
          name: pragyam-postgres
          property: connectionString

  # 2. Next.js Web & Admin Portal
  - type: web
    name: pragyam-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --install-links && npm run build --workspace=@pragyam/types && npm run build --workspace=@pragyam/shared && npm run build --workspace=@pragyam/web
    startCommand: npm run start --workspace=@pragyam/web
    envVars:
      - key: NODE_ENV
        value: production

databases:
  # Managed PostgreSQL 16 Database
  - name: pragyam-postgres
    plan: starter
    region: singapore
    databaseName: pragyam_brokerage_db
    user: pragyam_admin
